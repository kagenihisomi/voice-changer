[project]
name = "voice-changer"
version = "0.1.0"
description = "Real-time voice changer server"
requires-python = "==3.10.*"
dependencies = [
    "uvicorn==0.21.1",
    "pyOpenSSL==23.1.1",
    "numpy>=1.23.5,<2.0.0",
    "resampy==0.4.2",
    "python-socketio==5.8.0",
    "fastapi==0.95.1",
    "python-multipart==0.0.6",
    "scipy==1.10.1",
    "matplotlib==3.7.1",
    "websockets==11.0.2",
    "faiss-cpu>=1.8.0",
    "torchcrepe==0.0.18",
    "librosa==0.9.1",
    "gin_config==0.5.0",
    "einops==0.6.0",
    "local_attention==1.8.5",
    "sounddevice==0.4.6",
    "dataclasses_json==0.5.7",
    "onnx>=1.14.0",
    "onnxsim>=0.4.33",
    "torchfcpe==0.0.3",
    "setuptools<70",
    "fairseq>=0.12.2",
    "annotated-types==0.7.0",
    "ml-dtypes>=0.5.0",
    "pyworld>=0.3.5",
]

[project.optional-dependencies]
# 1. Standard CPU
cpu = ["torch==2.5.1", "torchaudio==2.5.1", "onnxruntime==1.15.1"]

# 2. NVIDIA GPU (CUDA)
cuda = ["torch==2.5.1", "torchaudio==2.5.1", "onnxruntime-gpu==1.15.1"]

# 3. AMD GPU (DirectML)
# Note: We use CPU Torch here because DirectML acceleration is handled 
# specifically by onnxruntime-directml. Using standard CUDA/ROCm torch here 
# would bloat the install without benefit.
directml = ["torch==2.5.1", "torchaudio==2.5.1", "onnxruntime-directml==1.15.1"]

# --- UV Configuration ---

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
# Map Torch to the correct index based on the requested extra
torch = [
    { index = "pytorch-cpu", marker = "extra == 'directml'" },
    { index = "pytorch-cu124", marker = "extra == 'cuda' and extra != 'directml'" },
]

# Map Torchaudio to the correct index based on the requested extra
torchaudio = [
    { index = "pytorch-cpu", marker = "extra == 'directml'" },
    { index = "pytorch-cu124", marker = "extra == 'cuda' and extra != 'directml'" },
]

# Torchvision (Optional, mapped just in case dependencies pull it in)
torchvision = [
    { index = "pytorch-cpu", marker = "extra == 'directml'" },
    { index = "pytorch-cu124", marker = "extra == 'cuda' and extra != 'directml'" },
]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["voice_changer"]
